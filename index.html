<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0038A8">
  <meta name="description" content="Interface web du système de gestion électorale de l'UEH.">
  <title>Élection UEH — Gestion électorale</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="flag-mark" aria-hidden="true"><i></i><i></i></div>
      <div><b>ÉLECTION UEH</b><small>Gestion électorale</small></div>
    </div>
    <div class="side-label">Navigation</div>
    <nav>
      <button class="nav-item active" data-view="dashboard"><span class="ic">⌂</span>Tableau de bord</button>
      <button class="nav-item" data-view="bvs"><span class="ic">▦</span>Bureaux de vote</button>
      <button class="nav-item" data-view="electeurs"><span class="ic">◉</span>Électeurs</button>
      <button class="nav-item" data-view="candidats"><span class="ic">☆</span>Candidats</button>
      <button class="nav-item" data-view="votes"><span class="ic">✓</span>Votes</button>
      <button class="nav-item" data-view="partis"><span class="ic">⚑</span>Partis politiques</button>
      <button class="nav-item" data-view="rapports"><span class="ic">▥</span>Rapports & résultats</button>
    </nav>
    <div class="side-bottom">
      <div class="status"><span class="online"></span><div><b>Système local</b><small>Données du navigateur</small></div></div>
      <button class="nav-item muted" id="clearLocal"><span class="ic">↺</span>Réinitialiser les données</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="leftbar"><button class="mobile-menu" id="menuBtn">☰</button><div><small class="crumb">Système électoral / <span id="crumb">Tableau de bord</span></small><h1 id="title">Vue d’ensemble</h1></div></div>
      <div class="actions"><button class="round" id="searchBtn" title="Recherche">⌕</button><button class="round" id="themeBtn" title="Mode sombre">◐</button><span class="avatar">UE</span></div>
    </header>
    <section class="content" id="app"></section>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <section class="modal" role="dialog" aria-modal="true">
    <div class="modal-head"><div><small id="modalKicker">Action</small><h2 id="modalTitle">Enregistrement</h2></div><button class="round" data-close-modal>×</button></div>
    <div id="modalBody"></div>
  </section>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
